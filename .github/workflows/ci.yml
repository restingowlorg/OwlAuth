name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Detect merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!package-lock.json' ':!LICENSE'; then
            echo "Merge conflict markers detected. Resolve them before merge."
            exit 1
          fi

      - name: Lint code
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm run test:unit

  database-integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: owlauth_test
          POSTGRES_USER: owlauth
          POSTGRES_PASSWORD: owlauth_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owlauth -d owlauth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: postgresql://owlauth:owlauth_test_password@localhost:5432/owlauth_test
      MONGODB_TEST_URI: mongodb://localhost:27017/owlauth_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL and MongoDB integration tests
        run: npm run test:integration
